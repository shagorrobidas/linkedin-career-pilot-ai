services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: careerpilot_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-linkedin_career_pilot}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis Cache & Celery Broker
  redis:
    image: redis:7-alpine
    container_name: careerpilot_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Django REST Framework Backend (Gunicorn)
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: careerpilot_backend
    restart: unless-stopped
    environment:
      DJANGO_ENV: production
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-django-insecure-production-secret-key-replace-in-env}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-linkedin_career_pilot}
      REDIS_URL: redis://redis:6379/0
      ALLOWED_HOSTS: localhost,127.0.0.1,backend,frontend
      CORS_ALLOWED_ORIGINS: http://localhost,http://127.0.0.1,http://localhost:5173
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  # React Frontend (Nginx Reverse Proxy)
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: careerpilot_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data:
